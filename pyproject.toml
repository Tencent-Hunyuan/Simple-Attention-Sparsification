[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
    {name = "rayleizhu", email = "ray.leizhu@outlook.com"},
    {name = "zhiweili", email= "zli404@connect.hkust-gz.edu.cn"}]
name = "sas"
requires-python = ">= 3.11, <3.12"
version = "0.1.0"
dependencies = [
    "torch>=2.8",
    "transformers",
    "flash-linear-attention", "httpx>=0.28.1,<0.29", "latex2sympy2>=1.9.1,<2", "word2number>=1.1,<2",
]

[project.optional-dependencies]
train = [
    "veomni[gpu] @ https://github.com/ByteDance-Seed/VeOmni.git"
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.extra-build-dependencies]
flash-moba = ["setuptools", "torch"]

[tool.pixi.workspace]
channels = ["https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-options]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
no-build-isolation = ["flash-attn"]

[tool.pixi.pypi-dependencies]
sas = { path = ".", editable = true, extras=["train"] }

[tool.pixi.dependencies]
jieba = ">=0.42.1,<0.43"
fuzzywuzzy = ">=0.18.0,<0.19"
rouge = ">=1.0.1,<2"
pytest = ">=8.0,<9"
# pytest pulls packaging via conda; veomni requires packaging<26, so pin it here
# to keep the conda and pypi solves compatible.
packaging = "<26"
